syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.grpc";
option csharp_namespace = "AMoverGRPC";

// --- Definições de Tipos ---

enum DrivingMode {
  ECO = 0;
  NORMAL = 1;
  SPORT = 2;
}

enum MaintenanceStatus {
  DUE_SOON = 0;
  SCHEDULED = 1;
  PLANNED = 2;
  COMPLETED = 3;
}

// --- Mensagens de Utilizador e Suporte ---

message UserRequest {} // Usado para ações gerais do utilizador (identificado pelo token de autenticação)

message UserProfile {
  string name = 1;
  string email = 2;
  string photo_uri = 3;
  string username = 4; // Identificador único do utilizador
}

message UpdatePhotoRequest {
  bytes image_data = 1;      // A imagem real transformada em dados brutos
  string file_extension = 2; // Para o servidor saber se é "jpg" ou "png"
}

message UpdateProfileInfoRequest {
  // Podes enviar só o nome, só o email, ou ambos de uma vez
  string name = 1;
  string email = 2;
}

message DealershipInfo {
  string name = 1;
  string phone = 2;
  string email = 3;
  string address = 4;
  string assistance_phone = 5; // Caso seja diferente do contacto geral da concessão
}

// --- Mensagens da Mota ---

message MotaRequest {
  string vin = 1;
}

message Document {
  string type = 1; // Ex: DUA, Seguro, Manual, etc.
  string uri = 2;
  int64 updated_at = 3; // Timestamp de quando o ficheiro foi alterado
}

message MotaResponse {
  // 1.1 Identificação e Estado Geral
  string vin = 1;
  string name = 2;
  bool is_connected = 3;
  bool is_started = 4;
  DrivingMode driving_mode = 5;

  // 1.2 Gestão de Energia (Bateria)
  int32 battery_level = 6;
  bool is_charging = 7;
  string battery_health = 8;
  int32 battery_cycles = 9;
  float battery_temperature = 10;
  float battery_consumption = 11; // em kW/h
  int32 battery_range = 12;      // Autonomia em km
  string charging_time = 13;     // ex: "1h57min"

  // 1.3 Estatísticas e Mecânica
  float energy_consumption_avg = 14; // kWh/100km
  int32 average_speed = 15;
  float tyre_front = 16;
  float tyre_back = 17;
  int32 total_kilometers = 18;
  int32 next_service_km = 19;

  // 1.4 Localização e Documentos
  double latitude = 20;
  double longitude = 21;
  repeated Document documents = 22;  // Lista de documentos associados à mota
}

// Resposta agregada para o Perfil e Frota
message UserDataResponse {
  UserProfile profile = 1;
  DealershipInfo dealership = 2;
  repeated MotaResponse bikes = 3; // Lista de todas as motas do utilizador (FROTA)
}

// --- Gestão de Convidados ---

message GuestAccessRequest {
  string vin = 1;
  string guest_email = 2;
}

message GuestListResponse {
  repeated string guest_emails = 1;
}

message ActionStatus {
  bool success = 1;
  string message = 2;
}

message AppNotification {
  string id = 1;
  string title = 2;
  string message = 3;
  int64 timestamp = 4; // Para saberes se foi há 5 minutos ou há 2 dias
  bool is_read = 5;    // Para mostrar a bolinha vermelha de "não lido"
}

message NotificationResponse {
  repeated AppNotification notifications = 1;
}

// --- Manutenção e Agenda ---

message MaintenanceRecord {
  int32 id = 1;
  string title = 2;
  string subtitle = 3;
  string description = 4;
  string date = 5;
  int32 km_trigger = 6;
  int32 days_remaining = 7;
  int32 km_remaining = 8;
  string service_center = 9;
  string estimated_time = 10;
  string estimated_cost = 11;
  MaintenanceStatus status = 12;
}

message MaintenanceAgendaResponse {
  repeated MaintenanceRecord items = 1;
}

message BookServiceRequest {
  string vin = 1;
  int32 maintenance_id = 2;
  string preferred_date = 3;
}

// --- Serviços ---

service MotasService {
  // Obter tudo o que o utilizador precisa ao fazer login (Perfil + Frota)
  rpc GetUserData (UserRequest) returns (UserDataResponse);

  // Sincronizar garagem/frota (Procurar novas motas atribuídas)
  rpc SyncGarage (UserRequest) returns (UserDataResponse);

  // Dados específicos de uma mota
  rpc GetMotaInfo (MotaRequest) returns (MotaResponse);

  // Streaming para telemetria em tempo real
  rpc StreamMotaUpdates (MotaRequest) returns (stream MotaResponse);

  // Gestão de Convidados / Chaves Digitais
  rpc ListGuestAccess (MotaRequest) returns (GuestListResponse);
  rpc AssignGuestPermission (GuestAccessRequest) returns (ActionStatus);
  rpc RevokeGuestAccess (GuestAccessRequest) returns (ActionStatus);

  // Atualizar dados de texto do perfil (Nome e Email)
    rpc UpdateProfileInfo (UpdateProfileInfoRequest) returns (ActionStatus);

  //Upload foto perfil
  rpc UpdateProfilePhoto (UpdatePhotoRequest) returns (ActionStatus);

  // Obter o histórico de notificações do utilizador
    rpc GetNotifications (UserRequest) returns (NotificationResponse);

    // Marcar uma notificação como lida (para apagar a bolinha vermelha)
    rpc MarkNotificationAsRead (MotaRequest) returns (ActionStatus); // MotaRequest ou cria um NotificationIdRequest

    // Obter a agenda de manutenção
    rpc GetMaintenanceAgenda (MotaRequest) returns (MaintenanceAgendaResponse);

    // Agendar um serviço
    rpc BookMaintenanceService (BookServiceRequest) returns (ActionStatus);
}
